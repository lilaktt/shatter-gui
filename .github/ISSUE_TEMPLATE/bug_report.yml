name: Bug report
description: Something does not work or looks wrong.
labels: ["bug"]
body:
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "26.1.2"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Shatter GUI version
      description: Shown in Mod Menu, or the name of the jar.
      placeholder: "0.1.0-beta"
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      description: All mods in your `mods` folder, with versions. Mention Spatial GUI, Iris, Sodium and the shader pack if you use them.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you opened or closed, with which effect and settings.
      placeholder: |
        1. Open a chest
        2. Press Esc
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: latest.log
      description: Attach `logs/latest.log` from the session where it happened (drag the file here), and `crash-reports/…` after a crash. For a stutter, set `"profiling": true` in `config/shatter_gui.json` first.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a short video, your `config/shatter_gui.json`.
