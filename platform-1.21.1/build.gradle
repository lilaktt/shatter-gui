plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

base {
    archivesName = project.archives_base_name
    group = project.maven_group
}
version = project.mod_version
def jarVersion = "${project.mod_version}+mc${project.minecraft_version}-${project.mod_loader}"

evaluationDependsOn(':core')
def core = project(':core')
sourceSets {
    main {
        java.srcDir core.file('src/main/java')
        resources.srcDir core.file('src/main/resources')
    }
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

def spatialGuiVersion = { String v -> "maven.modrinth:spatial-gui:${v}-fabric+1.21.1" }
def irisVersion = "maven.modrinth:iris:1.8.8+1.21.1-fabric"
def sodiumVersion = "maven.modrinth:sodium:mc1.21.1-0.6.13-fabric"
def modMenuVersion = "maven.modrinth:modmenu:11.0.3"
def yaclVersion = "maven.modrinth:yacl:3.6.6+1.21.1-fabric"

loom {
    mods {
        shatter_gui {
            sourceSet sourceSets.main
        }
        shatter_gui_test {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        clientTest {
            client()
            name = "Client Test"
            source sourceSets.gametest
            runDir = "build/run/clientTest"
            vmArg "-Dshatter.test=true"
            programArgs "--width", "1280", "--height", "720"
        }
    }
    runs.configureEach {
        if (project.hasProperty("testOnly")) {
            vmArg "-Dshatter.test.only=${project.property('testOnly')}"
        }
        if (project.hasProperty("shaderPack")) {
            vmArg "-Dshatter.test.shaderPack=${project.property('shaderPack')}"
        }
        if (project.hasProperty("lang")) {
            vmArg "-Dshatter.test.lang=${project.property('lang')}"
        }
        if (project.hasProperty("spatialMode")) {
            vmArg "-Dshatter.test.spatialMode=${project.property('spatialMode')}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modCompileOnly(modMenuVersion) { transitive = false }
    modCompileOnly(irisVersion) { transitive = false }

    if (project.hasProperty("shaders")) {
        modRuntimeOnly(irisVersion) { transitive = false }
        modRuntimeOnly(sodiumVersion) { transitive = false }
    }
    if (project.hasProperty("modMenu")) {
        modRuntimeOnly(modMenuVersion) { transitive = false }
    }
    if (project.hasProperty("spatialGui")) {
        modRuntimeOnly(spatialGuiVersion(project.property('spatialGui').toString())) { transitive = false }
        modRuntimeOnly(yaclVersion) { transitive = false }
    }
}

tasks.matching { it.name == "runClientTest" }.configureEach {
    doFirst {
        def dir = file("build/run/clientTest")
        delete new File(dir, "saves"), new File(dir, "screenshots"), new File(dir, "config/shatter_gui.json"),
                new File(dir, "config/shatter_gui")
    }
}

if (project.hasProperty("runJavaHome")) {
    tasks.matching { it.name.startsWith("run") && it instanceof JavaExec }.configureEach {
        def exe = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "java.exe" : "java"
        executable = "${project.property('runJavaHome')}/bin/${exe}"
    }
}

processResources {
    def props = [version: project.version, sources: project.mod_sources, issues: project.mod_issues,
                 modrinth: project.mod_modrinth, curseforge: project.mod_curseforge,
                 author: project.mod_author, license: project.mod_license]
    inputs.properties props
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand props
    }
}

check.dependsOn core.tasks.named('check')

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    ["LICENSE", "NOTICE", "THIRD_PARTY.md"].each { name ->
        from(rootProject.layout.projectDirectory.file(name)) {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }
}

remapJar {
    archiveVersion = jarVersion
    destinationDirectory = layout.buildDirectory.dir('tmp/distInput')
}
