# Minecraft 26.1.2, Fabric (the active, published platform)
minecraft_version=26.1.2
# Every 26.1.x patch runs the same jar ("minecraft": "~26.1" in fabric.mod.json; checked with game tests on 26.1, 26.1.1
# and 26.1.2, see NOTES.md): the jar is named after the line, not the patch it was compiled against.
minecraft_label=26.1
mod_loader=fabric
loader_version=0.19.3
fabric_api_version=0.155.3+26.1.2
java_version=25
# fabric.mod.json "minecraft"
minecraft_range=~26.1
# Optional mods on Modrinth (compile against them, dev runs): version numbers as the Modrinth Maven names them.
# Spatial GUI: <version>-<spatial_suffix>
spatial_suffix=fabric+26.1.x
spatial_compile=1.8
iris_version=1.11.4+26.1-fabric
sodium_version=mc26.1.2-0.9.2-fabric
modmenu_version=18.0.2
# The Loader of runs with Spatial GUI or Iris. Spatial GUI 1.10.1 needs YACL 3.9.7, which needs a Loader newer than 0.19.3 (its
# @Redirect has an array in "at", which crashes MixinExtras 0.5.4); Iris 1.11.7 on 26.3 crashes on 0.19.3 too. Only at run time:
# the mod is compiled against loader_version, the oldest it supports. Compiled against 0.20.1 its own @Redirect gets that
# array and it no longer starts on 0.19.3.
runtime_loader=0.20.1
# Loom takes MixinExtras from loader_version, so the newer one comes with runtime_loader by hand.
runtime_mixinextras=0.5.5
yacl_version=3.9.7+26.1-fabric
# The Spatial GUI of the version matrix (runVersionMatrix); empty: none for this version.
spatial_test=1.10.1
