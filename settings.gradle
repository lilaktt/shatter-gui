pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
    // One Loom for every platform: "fabric-loom" for the unobfuscated versions (26.x), "fabric-loom-remap" for the
    // obfuscated ones (1.21.1), both ship in the same artifact.
    plugins {
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    }
}

rootProject.name = 'shatter-gui'

// The code shared by every version and loader: no Minecraft, no loader (see docs/PORTING.md).
include 'core'

// One platform module per Minecraft version (and loader). Only the chosen ones are configured, so a build never sets up
// two Minecraft versions at once (memory): ./gradlew build -> the active one; -Pmc=1.21.1 -> that one; -Pmc=all -> all.
def platforms = [
        '26.1': 'platform-26',       // active: the published version, one jar for 26.1, 26.1.1 and 26.1.2
        '26.1.1': 'platform-26',
        '26.1.2': 'platform-26',
        '26.2': 'platform-26.2',
        '26.3': 'platform-26.3',
        '1.21.1': 'platform-1.21.1', // the port in progress
]
def active = '26.1'
def chosen = providers.gradleProperty('mc').getOrElse(active)
def selected = chosen == 'all' ? platforms.values().unique() : chosen.split(',').collect { v ->
    def module = platforms[v.trim()]
    if (module == null) {
        throw new GradleException("Unknown -Pmc=${v}; known: ${platforms.keySet().join(', ')} or all")
    }
    module
}
selected.unique().each { include it }
